<html>
<head>
<style>
header { background-color:#19A82F;width:100%;height:100px;font-size:20px;}
footer { background-color:#19A82F;width:100%;height:100px;
}



nav ul li{
list-style-type:none;
display: inline-block;
background-color:#19A82F;
}
nav ul li a{
text-decoration:none;
color:black;
margin:10px;
padding-bottom:30px;
}

.wrapper{
position:absolute;
background-color:yellow;
padding:25px;
border-radius:25px;
transform:translate(140%,-20%);
width:80%;
max-width:350px;
cursor:pointer;

}

.wrapper h2{
text-align:center;
margin-bottom:20px;
text-transform:uppercase;
letter-spacing:3px;
color:#941B91;
}

.wrapper .inputfield{ margin-bottom:10px;}

.wrapper .inputfield input[type=text],

.wrapper textarea{
border:1px solid red;
width:100%;
padding:10px;
}

.wrapper textarea{
resize:none;
height:80px;
}
.wrapper .btn input[type=submit]{
border:0px;
margin-top:15px;
padding:10px;
text-align:center;
width:100%;
background:#941B91;
color:white;
text-transform:uppercase;
letter-spacing:5px;
font-weight:bold;
border-radius:25px;
cursor:pointer;
}


</style>
<script>
function validate()
{
var name1=document.getElementById("name1").value;
var phone1=document.getElementById("phone1").value;
var email1=document.getElementById("email1").value;
var message1=document.getElementById("message1").value;

if(name1.length<10){
text="Please Enter Full name";
errormessage.innerHTML=text;
return false;
}

if(isNaN(phone1)||phone1.length!=10){
text="Please Enter valid Phone Number";
errormessage.innerHTML=text;
return false;
}

if(email1.indexOf("@")==-1||email1.length<6){
text="Please Enter valid Email";
errormessage.innerHTML=text;
return false;
}

if(message1.length<=20){
text="Please enter more than 140 character";
errormessage.innerHTML=text;
return false;
}
alert("Form Submitted Successsfully!!");
return true;
}
</script>
